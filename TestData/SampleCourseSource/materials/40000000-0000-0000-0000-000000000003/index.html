<body><main><h1>Резервное копирование: правило 3–2–1</h1><p>Хорошая резервная копия переживает поломку устройства, случайное удаление и другие непредвиденные события.</p><div class="numbers"><div class="item"><strong>3</strong>копии важных данных</div><div class="item"><strong>2</strong>разных типа носителей</div><div class="item"><strong>1</strong>копия вне основного устройства</div></div><p>Регулярно проверяйте, что резервную копию действительно можно восстановить.</p></main></body></html>
